<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>订单管理 - 卖家后台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background-color: #f5f5f5;
            color: #333;
        }

        /* 顶部导航 */
        .navbar {
            background: white;
            padding: 15px 30px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h1 {
            font-size: 20px;
            color: #333;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .nav-links a {
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
        }

        .nav-links a:hover {
            text-decoration: underline;
        }

        .nav-user {
            color: #666;
            font-size: 14px;
        }

        .btn-logout {
            background: none;
            border: 1px solid #ddd;
            padding: 6px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            color: #666;
        }

        .btn-logout:hover {
            border-color: #e74c3c;
            color: #e74c3c;
        }

        /* 主内容区 */
        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .page-header h2 {
            font-size: 24px;
            color: #333;
        }

        /* 筛选栏 */
        .filter-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 8px 16px;
            border: 1px solid #ddd;
            background: white;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .filter-btn:hover {
            border-color: #667eea;
            color: #667eea;
        }

        .filter-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        /* 订单列表 */
        .order-table {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 15px 20px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        th {
            background: #fafafa;
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }

        td {
            font-size: 14px;
        }

        .order-no {
            font-weight: 500;
            color: #667eea;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
        }

        .status-0 {
            background: #fff7e6;
            color: #fa8c16;
        }

        .status-1 {
            background: #e6f7ff;
            color: #1890ff;
        }

        .status-2 {
            background: #f6ffed;
            color: #52c41a;
        }

        .status-3 {
            background: #fff1f0;
            color: #ff4d4f;
        }

        .action-btns {
            display: flex;
            gap: 8px;
        }

        .btn-status {
            padding: 6px 12px;
            border: none;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
        }

        .btn-process {
            background: #e6f7ff;
            color: #1890ff;
        }

        .btn-process:hover {
            background: #bae7ff;
        }

        .btn-complete {
            background: #f6ffed;
            color: #52c41a;
        }

        .btn-complete:hover {
            background: #b7eb8f;
        }

        .btn-cancel {
            background: #fff1f0;
            color: #ff4d4f;
        }

        .btn-cancel:hover {
            background: #ffa39e;
        }

        /* 加载状态 */
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        /* 空状态 */
        .empty {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        /* 分页 */
        .pagination {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }

        .pagination button {
            padding: 8px 15px;
            border: 1px solid #ddd;
            background: white;
            border-radius: 4px;
            cursor: pointer;
        }

        .pagination button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .pagination button.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        /* 订单详情模态框 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 12px;
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            margin: 20px;
        }

        .modal-header {
            padding: 20px 25px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h3 {
            font-size: 18px;
            color: #333;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 24px;
            color: #999;
            cursor: pointer;
        }

        .modal-close:hover {
            color: #333;
        }

        .modal-body {
            padding: 25px;
        }

        .detail-item {
            margin-bottom: 15px;
        }

        .detail-item label {
            display: block;
            font-size: 13px;
            color: #999;
            margin-bottom: 5px;
        }

        .detail-item p {
            font-size: 15px;
            color: #333;
        }

        .modal-footer {
            padding: 15px 25px;
            border-top: 1px solid #eee;
            display: flex;
            justify-content: flex-end;
        }

        .btn-close {
            padding: 10px 20px;
            background: #f5f5f5;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
        }

        /* 响应式 */
        @media (max-width: 768px) {
            table {
                font-size: 12px;
            }

            th, td {
                padding: 10px;
            }

            .action-btns {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <!-- 顶部导航 -->
    <nav class="navbar">
        <h1>🎨 对联售卖系统</h1>
        <div class="nav-links">
            <a href="products.html">商品管理</a>
            <a href="orders.html">订单管理</a>
            <span class="nav-user" id="nav-user"></span>
            <button class="btn-logout" onclick="logout()">退出登录</button>
        </div>
    </nav>

    <!-- 主内容 -->
    <div class="container">
        <div class="page-header">
            <h2>订单管理</h2>
        </div>

        <!-- 筛选栏 -->
        <div class="filter-bar">
            <button class="filter-btn active" data-status="" onclick="filterOrders(this, '')">全部</button>
            <button class="filter-btn" data-status="0" onclick="filterOrders(this, '0')">待处理</button>
            <button class="filter-btn" data-status="1" onclick="filterOrders(this, '1')">处理中</button>
            <button class="filter-btn" data-status="2" onclick="filterOrders(this, '2')">已完成</button>
            <button class="filter-btn" data-status="3" onclick="filterOrders(this, '3')">已取消</button>
        </div>

        <div id="loading" class="loading">加载中...</div>
        <div id="order-table" class="order-table" style="display:none;">
            <table>
                <thead>
                    <tr>
                        <th>订单号</th>
                        <th>商品</th>
                        <th>买家信息</th>
                        <th>状态</th>
                        <th>下单时间</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="order-list"></tbody>
            </table>
        </div>
        <div id="empty" class="empty" style="display:none;">
            <p>暂无订单</p>
        </div>
        <div id="pagination" class="pagination" style="display:none;"></div>
    </div>

    <!-- 订单详情模态框 -->
    <div id="order-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>订单详情</h3>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body" id="order-detail"></div>
            <div class="modal-footer">
                <button class="btn-close" onclick="closeModal()">关闭</button>
            </div>
        </div>
    </div>

    <script src="orders.js"></script>
</body>
</html>
